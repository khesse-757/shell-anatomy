[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shell-anatomy"
version = "0.1.0"
description = "Manim CE visualizations of shell internals inspired by Ryan Baker's How the Shell Works"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
