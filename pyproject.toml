[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shell-anatomy"
version = "0.1.0"
description = "Manim CE visualizations of shell internals inspired by Ryan Baker's How the Shell Works"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.18.0",
    "manim-voiceover[elevenlabs]>=0.3.6",
    "gTTS>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=2.0.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
