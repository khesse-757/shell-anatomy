name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    env:
      UV_SYSTEM_PYTHON: 1
      UV_BREAK_SYSTEM_PACKAGES: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system graphics dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libpango1.0-dev libcairo2-dev ffmpeg libsox-fmt-all sox

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg sox pango cairo

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install Python dependencies
        run: uv pip install --system --break-system-packages -e ".[dev,docs]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with pytest
        env:
          VOICEOVER_BACKEND: none
        run: pytest -v
